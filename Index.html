<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pokédex Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-inner">
      <div class="header-top">
        <h1 class="page-title">Discovery</h1>
        <button class="theme-btn" id="themeToggle" title="Toggle theme">
          <span id="themeIcon">🌙</span>
        </button>
      </div>
      <div class="search-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="Search Pokémon…" autocomplete="off"/>
        <span class="search-count" id="searchHint"></span>
      </div>
    </div>
  </header>

  <!-- FILTERS -->
  <div class="filters-row">
    <div class="filters-inner">
      <div class="filter-chips" id="typeChips">
        <button class="type-chip active" data-type="">All</button>
      </div>
      <div class="sort-wrap">
        <select id="sortSelect" class="sort-select">
          <option value="id-asc">ID ↑</option>
          <option value="id-desc">ID ↓</option>
          <option value="name-asc">A → Z</option>
          <option value="name-desc">Z → A</option>
        </select>
      </div>
      <button class="fav-chip" id="favToggleBtn">♥ Favs</button>
    </div>
  </div>

  <!-- STATS BAR -->
  <div class="stats-row">
    <div class="stats-inner">
      <span class="nearby-label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
        Pokémon nearby
      </span>
      <span class="count-text" id="pokemonCount">Loading…</span>
    </div>
  </div>

  <!-- LOADER -->
  <div class="loader-screen" id="loader">
    <div class="pokeball-anim">
      <div class="pa-top"></div>
      <div class="pa-bot"></div>
      <div class="pa-line"></div>
      <div class="pa-dot"></div>
    </div>
    <p>Loading Pokémon…</p>
  </div>

  <!-- GRID -->
  <main class="poke-grid" id="pokemonGrid"></main>

  <!-- EMPTY -->
  <div class="empty-state hidden" id="noResults">
    <p>🔍 No Pokémon found</p>
    <span>Try adjusting your search or filter</span>
  </div>

  <!-- PAGINATION -->
  <div class="pager" id="pagination">
    <button class="pager-btn" id="prevBtn" disabled>‹ Prev</button>
    <span class="pager-dots" id="pageInfo">1 / 1</span>
    <button class="pager-btn" id="nextBtn">Next ›</button>
  </div>

  <!-- DETAIL MODAL -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal-sheet" id="modal">
      <button class="modal-back" id="modalClose">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      </button>
      <button class="modal-star" id="modalFav">☆</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
